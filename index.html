<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#3a3b38; --muted:#7c8078; --line:#e4e5dc;
  --rose:#5f6d57; --rose-soft:#e9ede3; --sage:#b5c3b6; --olive:#a9b08e; --moss:#7b8570; --deep:#454a42;
  --green:#4f7a55; --green-soft:#e5efe3;
  --red:#a8483c; --red-soft:#f6e6e2; --amber:#8f6b1e; --amber-soft:#f6edd6;
  --shadow:0 1px 2px rgba(50,56,44,.05),0 6px 18px rgba(50,56,44,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161815; --card:#1f221d; --ink:#eceee7; --muted:#a2a89b; --line:#33372f;
    --rose:#a9b79b; --rose-soft:#2a3026; --deep:#262b23;
    --green:#8fc296; --green-soft:#1f2f22;
    --red:#e58b7f; --red-soft:#3a2420; --amber:#dcb45c; --amber-soft:#352c16;
    --shadow:none;
  }
  .btn,.chip.on,.fab{color:#161815 !important}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:780px;margin:0 auto;padding:0 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 10px}
header h1{margin:0;font-size:21px;letter-spacing:.2px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-weight:600}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand svg{width:44px;height:44px;flex:none}
header .sub{letter-spacing:.2px}
header .sub{color:var(--muted);font-size:13px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;box-shadow:var(--shadow)}
.pill b{font-variant-numeric:tabular-nums}
.pill{white-space:nowrap}header .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{margin:6px 0 10px;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--amber-soft);color:var(--amber)}
.banner.err{background:var(--red-soft);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.total{background:var(--deep);border-color:var(--deep);color:#f4f5ef;padding:18px 16px}.total .lbl{color:#c5ccbd;text-transform:uppercase;letter-spacing:.6px;font-size:11.5px}.total .big{margin:4px 0 2px}.total .big{color:#f4f5ef}.total .big ~ .lbl{text-transform:none;letter-spacing:0;font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.caja{text-align:left;width:100%}
.caja .n{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.caja .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.caja .e{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:12px;margin:22px 2px 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.9px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.monthnav .m{font-weight:650}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat .lbl{text-transform:uppercase;letter-spacing:.6px;font-size:11.5px;font-weight:600}
.stat .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .pend{color:var(--amber)}
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar i{display:block;height:8px;border-radius:6px;min-width:3px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l{min-width:0;flex:1}
.item .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .r .a{font-weight:650}
.item .r .u{font-size:12px;color:var(--muted)}
.day{font-size:13px;color:var(--muted);margin:14px 4px 6px;text-transform:capitalize;font-weight:600}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--amber-soft);color:var(--amber);margin-left:6px;vertical-align:1px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--rose);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--rose);color:#fff;border-color:var(--rose)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--rose)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea{margin-top:4px;color:var(--ink)}
label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:4px 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{margin:6px 0 10px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabbar .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:6px;align-items:center}
.tab{border:0;background:none;padding:9px 4px;border-radius:12px;font-size:14px;color:var(--muted);font-weight:600}
.tab.on{color:var(--rose);background:var(--rose-soft)}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:30px;line-height:1;margin:-22px 6px 0;box-shadow:0 6px 16px rgba(70,84,62,.35)}
.fab[hidden]{display:none}
.sheetwrap{position:fixed;inset:0;background:rgba(20,10,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 22px}
@media (min-width:700px){.sheetwrap{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sheet .actions .btn{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bcvbar{font-size:13px;color:var(--muted);margin:6px 0 2px}.bcvbar b{color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
a{color:var(--rose)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
</style>

<script type="module">
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const nf = new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = (n,m) => (m === 'USD' ? '$ ' : 'Bs ') + nf.format(n || 0);
const r2 = n => Math.round(n * 100) / 100;
function num(s){
  s = String(s == null ? '' : s).trim().replace(/\s/g,'');
  if(!s) return NaN;
  const c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  if(c > -1 && d > -1){ s = c > d ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(c > -1){ s = (s.match(/,/g)||[]).length > 1 ? s.replace(/,/g,'') : s.replace(',','.'); }
  return Number(s);
}
function fdate(s){
  const p = String(s||'').split('-').map(Number);
  if(p.length < 3 || !p[0]) return s || '';
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es-VE',{weekday:'short',day:'numeric',month:'short'});
}
function mlabel(mes){
  if(!mes) return 'Todos los meses';
  if(String(mes).length === 4) return 'Año ' + mes;
  const p = mes.split('-').map(Number);
  const t = new Date(p[0],p[1]-1,1).toLocaleDateString('es-VE',{month:'long',year:'numeric'}).replace(' de ',' ');
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function shiftMes(mes,delta){
  const p = mes.split('-').map(Number);
  const d = new Date(p[0],p[1]-1+delta,1);
  return d.getFullYear() + '-' + pad(d.getMonth()+1);
}
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* ---------- catálogo ---------- */
const CAJAS = {
  zelle:   {n:'Zelle',        m:'USD'},
  efe_usd: {n:'Efectivo $',   m:'USD'},
  bs:      {n:'Cuenta en Bs', m:'VES'},
  efe_bs:  {n:'Efectivo Bs',  m:'VES'}
};
const TIPOS = {
  venta:   {n:'Venta',        s: 1},
  compra:  {n:'Compra',       s:-1},
  gasto:   {n:'Gasto',        s:-1},
  ingreso: {n:'Otro ingreso', s: 1},
  cambio:  {n:'Cambio entre cajas'},
  inicial: {n:'Saldo inicial',s: 1},
  retiro:  {n:'Retiro del dueño', s:-1},
  aporte:  {n:'Aporte del dueño', s: 1},
  ajuste:  {n:'Ajuste de caja', hide:true}
};
// gastos antiguos que en realidad son retiros de los dueños
const RET = ['Vivienda (alquiler)','Educación','Salud','Personal / hogar'];
const esRetiro = m => m.tipo === 'retiro' || (m.tipo === 'gasto' && RET.indexOf(m.cat) >= 0);
const CATS = ['Alquiler','Servicios','Sueldos','Transporte','Empaque y materiales','Otros','Vivienda (alquiler)','Educación','Salud','Personal / hogar','Préstamos','Cambio de divisas'];
// gastos que salen de la caja pero no son del negocio: no restan a la ganancia
const NOOP = ['Vivienda (alquiler)','Educación','Salud','Personal / hogar','Préstamos','Cambio de divisas'];

/* ---------- estado ---------- */
const S = {
  tab:'res', mes: ymd(new Date()).slice(0,7),
  movs:[], cli:[], tasa:0,
  db:null, user:null, uid:null, canWrite:true,
  loaded:{movs:false,cli:false,tasa:false}, slow:false, err:'',
  fCaja:'', fTipo:'', q:'', qc:'',
  names:{}, asked:{}
};

/* ---------- cálculos ---------- */
function usd(m){
  if(m.moneda === 'USD') return m.monto || 0;
  const t = m.tasa || S.tasa;
  return t ? (m.monto || 0) / t : 0;
}
function balances(){
  const b = {zelle:0,efe_usd:0,bs:0,efe_bs:0};
  S.movs.forEach(m => { if(m.caja && b[m.caja] != null && m.pagado !== false) b[m.caja] += (m.signo || 0) * (m.monto || 0); });
  return b;
}
function monthStats(mes){
  const o = {ventas:0,compras:0,gastos:0,personal:0,retiros:0,aportes:0};
  S.movs.forEach(m => {
    if(mes && String(m.fecha||'').slice(0,7) !== mes) return;
    if(m.tipo === 'venta') o.ventas += usd(m);
    else if(m.tipo === 'compra') o.compras += usd(m);
    else if(m.tipo === 'gasto'){ if(NOOP.indexOf(m.cat) >= 0) o.personal += usd(m); else o.gastos += usd(m); }
    if(esRetiro(m)) o.retiros += usd(m);
    if(m.tipo === 'aporte') o.aportes += usd(m);
  });
  return o;
}
function sorted(list){
  return list.slice().sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)) || (b.creado||0) - (a.creado||0));
}
const cliById = id => S.cli.find(c => c.id === id);
const cliName = m => { const c = cliById(m.clienteId); return c ? c.nombre : (m.clienteNombre || ''); };
const nameOf = id => id === S.uid ? 'tú' : (S.names[id] || '');
const money = (n,m) => fmt(n,m);

/* ---------- UI base ---------- */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toastHost').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function updateBanner(){
  const b = $('#banner');
  let h = '';
  if(!S.db && S.setup) h = '<div class="banner err">Falta configurar la conexión (archivo firebase-config.js).</div>';
  else if(!S.db) h = '<div class="banner err">No se pudo conectar con los datos. Revisa tu internet e intenta de nuevo.</div>';
  else if(S.err) h = '<div class="banner err">Error con los datos (' + esc(S.err) + '). Intenta de nuevo en un momento.</div>';
  else if(S.slow && !(S.loaded.movs && S.loaded.cli && S.loaded.tasa)) h = '<div class="banner">Cargando… si tarda, revisa tu conexión a internet.</div>';
  else if(!S.canWrite) h = '<div class="banner">Tienes acceso solo de lectura. Pide que te compartan como colaborador para poder registrar.</div>';
  b.innerHTML = h;
  $('#fab').hidden = !S.canWrite;
  $('#tasaVal').textContent = S.tasa ? nf.format(S.tasa) : 'definir';
  bcvPaint();
}

function setTab(t){
  S.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  buildShell();
  fill();
  window.scrollTo(0,0);
}
function buildShell(){
  const main = $('#main');
  if(S.tab === 'res') main.innerHTML = '<div id="res"></div>';
  else if(S.tab === 'mov'){
    main.innerHTML =
      '<div class="monthnav"><button class="iconbtn" data-act="mesprev" aria-label="Mes anterior">‹</button>' +
      '<div class="m" id="movMes"></div>' +
      '<div class="row"><button class="iconbtn" data-act="mesnext" aria-label="Mes siguiente">›</button>' +
      '<button class="chip" data-act="mestodo" id="mesTodo">Todo</button></div></div>' +
      '<div class="chips" id="cajaChips"></div>' +
      '<div class="row2 search"><select id="fTipo"><option value="">Todos los tipos</option>' +
      Object.keys(TIPOS).map(k => '<option value="'+k+'">'+TIPOS[k].n+'</option>').join('') + '</select>' +
      '<input id="fQ" type="search" placeholder="Buscar…"></div>' +
      '<div id="movList"></div>';
    $('#fTipo').value = S.fTipo;
    $('#fQ').value = S.q;
    $('#fTipo').addEventListener('change', e => { S.fTipo = e.target.value; fillMov(); });
    $('#fQ').addEventListener('input', e => { S.q = e.target.value; fillMov(); });
  } else {
    main.innerHTML =
      '<div class="row search"><input id="qc" type="search" placeholder="Buscar cliente…" style="flex:1">' +
      '<button class="btn small" data-act="newcli">+ Cliente</button></div><div id="cliList"></div>';
    $('#qc').value = S.qc;
    $('#qc').addEventListener('input', e => { S.qc = e.target.value; fillCli(); });
  }
}
function fill(){
  if(S.tab === 'res') fillRes();
  else if(S.tab === 'mov') fillMov();
  else fillCli();
  updateBanner();
  resolveNames();
}

/* ---------- Resumen ---------- */
function itemHtml(m, opts){
  opts = opts || {};
  const t = TIPOS[m.tipo] || {n:m.tipo};
  const pend = m.pagado === false;
  const cls = pend ? 'pend' : (m.signo > 0 ? 'pos' : 'neg');
  const sign = m.signo > 0 ? '+' : '−';
  const who = m.tipo === 'venta' ? cliName(m) : (m.tercero || '');
  const title = m.desc || (m.tipo === 'cambio' ? (m.signo > 0 ? 'Cambio: entrada' : 'Cambio: salida') : t.n);
  const cajaTxt = m.caja ? CAJAS[m.caja].n : (pend ? (m.signo > 0 ? 'Por cobrar' : 'Por pagar') : '');
  const sub = [t.n, cajaTxt, who].filter(Boolean).join(' · ');
  const eq = (m.moneda === 'VES' && usd(m)) ? '<div class="u">≈ ' + money(usd(m),'USD') + '</div>' : '';
  const por = m.por ? '<span class="who" data-uid="' + esc(m.por) + '"></span>' : '';
  return '<button class="item" data-act="' + (opts.act || 'edit') + '" data-id="' + esc(m.id) + '">' +
    '<div class="l"><div class="t">' + esc(title) + (pend ? '<span class="badge">pendiente</span>' : '') + '</div>' +
    '<div class="s">' + esc(sub) + (por ? ' · ' : '') + por + '</div></div>' +
    '<div class="r"><div class="a ' + cls + '">' + sign + ' ' + money(m.monto,m.moneda) + '</div>' + eq + '</div></button>';
}
function fillRes(){
  const el = $('#res'); if(!el) return;
  const b = balances();
  const bsTot = b.bs + b.efe_bs;
  const usdTot = b.zelle + b.efe_usd;
  const total = usdTot + (S.tasa ? bsTot / S.tasa : 0);
  const pend = S.movs.filter(m => m.pagado === false);
  let cobrar = 0, pagar = 0;
  pend.forEach(m => { const v = usd(m); if(m.signo > 0) cobrar += v; else pagar += v; });
  const st = monthStats(S.mes);
  const ganancia = st.ventas - st.compras - st.gastos;
  const mx = Math.max(st.ventas, st.compras, st.gastos, 1);
  const sinTasa = !S.tasa && bsTot !== 0;
  let h = '';
  h += '<div class="card total"><div class="lbl">Total aproximado en dólares</div>' +
       '<div class="big">' + money(total,'USD') + '</div>' +
       '<div class="lbl">Dólares ' + money(usdTot,'USD') + ' · Bolívares ' + money(bsTot,'VES') +
       (sinTasa ? '<br>Define la tasa (arriba) para sumar los bolívares.' : '') + '</div></div>';
  h += '<div class="grid">';
  Object.keys(CAJAS).forEach(k => {
    const c = CAJAS[k];
    const eq = (c.m === 'VES' && S.tasa) ? '<div class="e">≈ ' + money(b[k] / S.tasa,'USD') + '</div>' : '<div class="e">&nbsp;</div>';
    h += '<button class="card caja" data-act="gocaja" data-id="' + k + '"><div class="n">' + c.n + '</div>' +
         '<div class="v ' + (b[k] < 0 ? 'neg' : '') + '">' + money(b[k],c.m) + '</div>' + eq + '</button>';
  });
  h += '</div>';

  h += '<div class="stats">' +
       '<div class="card stat"><div class="lbl">Por cobrar</div><div class="v pend">' + money(cobrar,'USD') + '</div></div>' +
       '<div class="card stat"><div class="lbl">Por pagar</div><div class="v pend">' + money(pagar,'USD') + '</div></div></div>';
  if(pend.length){
    h += '<h2>Pendientes</h2><div class="list">' + sorted(pend).map(m => itemHtml(m,{act:'cobrar'})).join('') + '</div>' +
         '<div class="hint" style="margin-top:6px">Toca un pendiente para marcarlo como cobrado o pagado.</div>';
  }

  h += '<div class="monthnav"><button class="iconbtn" data-act="resprev" aria-label="Mes anterior">‹</button>' +
       '<div class="m">' + esc(mlabel(S.mes)) + '</div>' +
       '<button class="iconbtn" data-act="resnext" aria-label="Mes siguiente">›</button></div>';
  h += '<div class="card"><div class="stats">' +
       '<div class="stat"><div class="lbl">Ventas</div><div class="v pos">' + money(st.ventas,'USD') + '</div></div>' +
       '<div class="stat"><div class="lbl">Compras</div><div class="v">' + money(st.compras,'USD') + '</div></div>' +
       '<div class="stat"><div class="lbl">Gastos</div><div class="v">' + money(st.gastos,'USD') + '</div></div>' +
       '<div class="stat"><div class="lbl">Ganancia estimada</div><div class="v ' + (ganancia < 0 ? 'neg' : 'pos') + '">' + money(ganancia,'USD') + '</div></div></div>' +
       '<div class="bars">' +
       '<div class="bar"><span>Ventas</span><i style="width:' + (st.ventas / mx * 100) + '%;background:var(--green)"></i></div>' +
       '<div class="bar"><span>Compras</span><i style="width:' + (st.compras / mx * 100) + '%;background:var(--olive)"></i></div>' +
       '<div class="bar"><span>Gastos</span><i style="width:' + (st.gastos / mx * 100) + '%;background:var(--amber)"></i></div></div>' +
       '<div class="hint" style="margin:10px 0 12px">Ganancia = ventas − compras − gastos del negocio. Los retiros de los dueños, préstamos y cambios de divisas van aparte.' + (st.retiros > 0 ? ' <b>Retiros del dueño: ' + money(st.retiros,'USD') + '</b>.' : '') + '</div>' +
       '<button class="btn" style="width:100%" data-act="cierre">Ver estado financiero del mes</button>' +
       '<button class="btn" style="width:100%;margin-top:8px" data-act="cierreanio">Ver estado del año</button>' +
       '<div class="row2" style="margin-top:8px">' + (S.canWrite ? '<button class="btn sec" data-act="cuadrar">Cuadrar caja</button>' : '<span></span>') + '<button class="btn sec" data-act="exportar">Exportar a Excel</button></div>' +
       (S.canWrite ? '<button class="btn" style="width:100%;margin-top:8px;background:transparent;color:var(--muted);border:1px solid var(--line)" data-act="importar">Importar historial (archivo)</button><input type="file" id="impFile" accept=".json,application/json" hidden>' : '') + '</div>';

  const last = sorted(S.movs).slice(0,6);
  h += '<h2>Últimos movimientos</h2>';
  h += last.length ? '<div class="list">' + last.map(m => itemHtml(m)).join('') + '</div>'
                   : '<div class="empty">Aún no hay movimientos. Toca <b>+</b> para registrar el primero (puedes empezar con los saldos iniciales de cada caja).</div>';
  el.innerHTML = h;
}

/* ---------- Movimientos ---------- */
function fillMov(){
  const list = $('#movList'); if(!list) return;
  $('#movMes').textContent = mlabel(S.mes);
  $('#mesTodo').classList.toggle('on', !S.mes);
  $('#mesTodo').textContent = S.mes ? 'Todo' : 'Mes';
  $('#cajaChips').innerHTML =
    '<button class="chip ' + (!S.fCaja ? 'on' : '') + '" data-act="fcaja" data-id="">Todas</button>' +
    Object.keys(CAJAS).map(k => '<button class="chip ' + (S.fCaja === k ? 'on' : '') + '" data-act="fcaja" data-id="' + k + '">' + CAJAS[k].n + '</button>').join('') +
    '<button class="chip ' + (S.fCaja === '_pend' ? 'on' : '') + '" data-act="fcaja" data-id="_pend">Pendientes</button>';
  const q = S.q.trim().toLowerCase();
  let rows = S.movs.filter(m => {
    if(S.mes && String(m.fecha||'').slice(0,7) !== S.mes) return false;
    if(S.fCaja === '_pend'){ if(m.pagado !== false) return false; }
    else if(S.fCaja && m.caja !== S.fCaja) return false;
    if(S.fTipo && m.tipo !== S.fTipo) return false;
    if(q){
      const hay = [m.desc, m.tercero, cliName(m), m.cat, (TIPOS[m.tipo]||{}).n].join(' ').toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  rows = sorted(rows);
  if(!rows.length){
    list.innerHTML = '<div class="empty">' + (S.movs.length ? 'No hay movimientos con estos filtros.' : 'Aún no hay movimientos.') + '</div>';
    return;
  }
  let h = '', day = '';
  rows.forEach(m => {
    if(m.fecha !== day){ day = m.fecha; h += '<div class="day">' + esc(fdate(day)) + '</div>'; }
    h += '<div class="list" style="margin-bottom:8px">' + itemHtml(m) + '</div>';
  });
  list.innerHTML = '<div class="hint">' + rows.length + ' movimiento' + (rows.length === 1 ? '' : 's') + '</div>' + h;
  resolveNames();
}

/* ---------- Clientes ---------- */
function cliStats(id){
  let total = 0, n = 0, last = '', pend = 0;
  S.movs.forEach(m => {
    if(m.tipo !== 'venta' || m.clienteId !== id) return;
    total += usd(m); n++;
    if(String(m.fecha) > last) last = m.fecha;
    if(m.pagado === false) pend += usd(m);
  });
  return {total, n, last, pend};
}
function fillCli(){
  const list = $('#cliList'); if(!list) return;
  const q = S.qc.trim().toLowerCase();
  const rows = S.cli.filter(c => !q || (c.nombre + ' ' + (c.telefono||'') + ' ' + (c.notas||'')).toLowerCase().indexOf(q) >= 0)
                    .sort((a,b) => String(a.nombre).localeCompare(String(b.nombre),'es'));
  if(!rows.length){
    list.innerHTML = '<div class="empty">' + (S.cli.length ? 'Ningún cliente coincide.' : 'Aún no hay clientes. Agrégalos aquí o al registrar una venta.') + '</div>';
    return;
  }
  list.innerHTML = '<div class="list">' + rows.map(c => {
    const s = cliStats(c.id);
    return '<button class="item" data-act="cliver" data-id="' + esc(c.id) + '"><div class="l"><div class="t">' + esc(c.nombre) + '</div>' +
      '<div class="s">' + (s.n ? s.n + ' compra' + (s.n === 1 ? '' : 's') + ' · última ' + esc(fdate(s.last)) : 'Sin compras registradas') + '</div></div>' +
      '<div class="r"><div class="a">' + money(s.total,'USD') + '</div>' +
      (s.pend ? '<div class="u pend">debe ' + money(s.pend,'USD') + '</div>' : '') + '</div></button>';
  }).join('') + '</div>';
}

/* ---------- hojas (modales) ---------- */
const M = {f:null, fields:null, rerender:[], kind:''};
function openSheet(n, html){
  $('#s' + n).innerHTML = html;
  $('#m' + n).hidden = false;
  $('#s' + n).scrollTop = 0;
}
function closeSheet(n){ $('#m' + n).hidden = true; $('#s' + n).innerHTML = ''; if(n === 1){ M.f = null; M.fields = null; M.kind = ''; } }
['m1','m2'].forEach(id => {
  $('#' + id).addEventListener('click', e => { if(e.target.id === id) closeSheet(id === 'm1' ? 1 : 2); });
});
function askConfirm(msg, okLabel){
  return new Promise(res => {
    openSheet(2, '<h3>' + esc(msg) + '</h3><div class="actions"><button class="btn sec" id="cNo">Cancelar</button>' +
      '<button class="btn danger" id="cYes">' + esc(okLabel || 'Confirmar') + '</button></div>');
    $('#cNo').onclick = () => { closeSheet(2); res(false); };
    $('#cYes').onclick = () => { closeSheet(2); res(true); };
  });
}
$('#s1').addEventListener('input', e => {
  if(!M.f || !e.target.name) return;
  M.f[e.target.name] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if(e.target.name === 'monto') M.f.montoEdit = true;
  if(M.kind === 'cambio') { const hh = $('#cambioHint'); if(hh) hh.innerHTML = cambioHint(M.f); }
  if(M.kind === 'cuadrar') { const hh = $('#cuadHint'); if(hh) hh.innerHTML = cuadrarHint(M.f); }
});
$('#s1').addEventListener('change', e => {
  if(!M.f || !e.target.name) return;
  M.f[e.target.name] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if(M.rerender.indexOf(e.target.name) >= 0 && M.fields){
    if(M.kind === 'cobrar' && e.target.name === 'caja') cobrarSync(M.f);
    $('#fbody').innerHTML = M.fields(M.f);
  }
});

/* ---------- formulario de movimiento ---------- */
const cajaOpts = sel => Object.keys(CAJAS).map(k => '<option value="' + k + '"' + (sel === k ? ' selected' : '') + '>' + CAJAS[k].n + '</option>').join('');
function cambioHint(f){
  const a = CAJAS[f.o_caja], b = CAJAS[f.d_caja];
  const o = num(f.o_monto), d = num(f.d_monto);
  if(!a || !b || !(o > 0) || !(d > 0)) return '';
  if(a.m === b.m) return '';
  const ves = a.m === 'VES' ? o : d, dol = a.m === 'USD' ? o : d;
  return 'Tasa implícita: Bs ' + nf.format(ves / dol) + ' por $';
}
function movFields(f){
  let h = '';
  h += '<label>Fecha<input type="date" name="fecha" value="' + esc(f.fecha) + '"></label>';
  if(f.tipo === 'cambio'){
    h += '<div class="row2"><label>Sale de<select name="o_caja">' + cajaOpts(f.o_caja) + '</select></label>' +
         '<label>Monto que sale<input name="o_monto" inputmode="decimal" placeholder="0,00" value="' + esc(f.o_monto) + '"></label></div>';
    h += '<div class="row2"><label>Entra a<select name="d_caja">' + cajaOpts(f.d_caja) + '</select></label>' +
         '<label>Monto que entra<input name="d_monto" inputmode="decimal" placeholder="0,00" value="' + esc(f.d_monto) + '"></label></div>';
    h += '<div class="hint" id="cambioHint">' + cambioHint(f) + '</div>';
    h += '<label>Nota (opcional)<input name="desc" value="' + esc(f.desc) + '" placeholder="Ej. cambié dólares para pagar proveedor"></label>';
    return h;
  }
  const credit = f.tipo === 'venta' || f.tipo === 'compra';
  if(credit) h += '<label class="chk"><input type="checkbox" name="pagado"' + (f.pagado ? ' checked' : '') + '> ' + (f.tipo === 'venta' ? 'Ya me pagaron' : 'Ya lo pagué') + '</label>';
  const conCaja = !credit || f.pagado;
  let moneda;
  if(conCaja){
    moneda = CAJAS[f.caja].m;
    const entra = (TIPOS[f.tipo].s || M.oldSigno || 1) > 0;
    h += '<label>' + (entra ? 'Entra a' : 'Sale de') + '<select name="caja">' + cajaOpts(f.caja) + '</select></label>';
  } else {
    moneda = f.moneda;
    h += '<label>Moneda de la deuda<select name="moneda"><option value="USD"' + (f.moneda === 'USD' ? ' selected' : '') + '>Dólares ($)</option>' +
         '<option value="VES"' + (f.moneda === 'VES' ? ' selected' : '') + '>Bolívares (Bs)</option></select></label>';
  }
  h += '<div class="' + (moneda === 'VES' ? 'row2' : '') + '"><label>Monto (' + (moneda === 'USD' ? '$' : 'Bs') + ')' +
       '<input name="monto" inputmode="decimal" placeholder="0,00" value="' + esc(f.monto) + '"></label>';
  if(moneda === 'VES') h += '<label>Tasa Bs por $<input name="tasa" inputmode="decimal" placeholder="Ej. 45,50" value="' + esc(f.tasa) + '"></label>';
  h += '</div>';
  if(f.tipo === 'venta'){
    h += '<label>Cliente<select name="clienteId"><option value="">Sin cliente (mostrador)</option>' +
         S.cli.slice().sort((a,b) => String(a.nombre).localeCompare(String(b.nombre),'es')).map(c => '<option value="' + esc(c.id) + '"' + (f.clienteId === c.id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('') +
         '<option value="__nuevo"' + (f.clienteId === '__nuevo' ? ' selected' : '') + '>+ Cliente nuevo…</option></select></label>';
    if(f.clienteId === '__nuevo') h += '<label>Nombre del cliente nuevo<input name="clienteNuevo" value="' + esc(f.clienteNuevo) + '" autocomplete="off"></label>';
  }
  if(f.tipo === 'compra'){
    const provs = Array.from(new Set(S.movs.filter(m => m.tipo === 'compra' && m.tercero).map(m => m.tercero)));
    h += '<label>Proveedor<input name="tercero" list="provList" value="' + esc(f.tercero) + '" autocomplete="off"></label>' +
         '<datalist id="provList">' + provs.map(p => '<option value="' + esc(p) + '">').join('') + '</datalist>';
  }
  if(f.tipo === 'gasto'){
    h += '<label>Categoría<select name="cat">' + CATS.map(c => '<option' + (f.cat === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></label>';
  }
  const ph = f.tipo === 'venta' ? 'Ej. ramo de rosas, 2 docenas' : f.tipo === 'compra' ? 'Ej. 10 docenas de rosas' : f.tipo === 'inicial' ? 'Ej. saldo al empezar a usar la app' : f.tipo === 'retiro' ? 'Ej. alquiler de la casa, universidad, mercado' : f.tipo === 'aporte' ? 'Ej. dinero propio que metí al negocio' : 'Detalle';
  if(f.tipo === 'retiro') h += '<div class="hint">Dinero que sacan ustedes para cosas personales. Sale de la caja pero no cuenta como gasto del negocio.</div>';
  if(f.tipo === 'aporte') h += '<div class="hint">Dinero propio que entra al negocio. No cuenta como venta.</div>';
  h += '<label>Detalle<input name="desc" value="' + esc(f.desc) + '" placeholder="' + esc(ph) + '"></label>';
  return h;
}
function openMov(opts){
  opts = opts || {};
  const old = opts.id ? S.movs.find(m => m.id === opts.id) : null;
  if(old && old.tipo === 'cambio'){ return openCambioView(old); }
  const tasaTxt = S.tasa ? String(S.tasa).replace('.',',') : '';
  const f = old ? {
    tipo: old.tipo, fecha: old.fecha, pagado: old.pagado !== false,
    caja: old.caja || 'zelle', moneda: old.moneda || 'USD', monto: String(old.monto).replace('.',','),
    tasa: old.tasa ? String(old.tasa).replace('.',',') : tasaTxt,
    clienteId: old.clienteId || '', clienteNuevo: '', tercero: old.tercero || '', cat: old.cat || 'Otros', desc: old.desc || '',
    o_caja:'efe_bs', o_monto:'', d_caja:'zelle', d_monto:''
  } : {
    tipo: opts.tipo || 'venta', fecha: ymd(new Date()), pagado: true, caja:'zelle', moneda:'USD', monto:'', tasa: tasaTxt,
    clienteId: opts.clienteId || '', clienteNuevo:'', tercero:'', cat:'Otros', desc:'',
    o_caja:'efe_bs', o_monto:'', d_caja:'zelle', d_monto:''
  };
  M.f = f; M.fields = movFields; M.kind = 'mov'; M.oldSigno = old ? old.signo : 1;
  M.rerender = ['pagado','caja','moneda','clienteId','o_caja','d_caja'];
  const tipoChips = () => Object.keys(TIPOS).filter(k => !TIPOS[k].hide).map(k => '<button type="button" class="chip ' + (f.tipo === k ? 'on' : '') + '" data-act="settipo" data-id="' + k + '">' + TIPOS[k].n + '</button>').join('');
  M.tipoChips = tipoChips;
  openSheet(1,
    '<h3>' + (old ? 'Editar movimiento' : 'Nuevo movimiento') + '</h3>' +
    (old ? '' : '<div class="seg" id="tipoSeg">' + tipoChips() + '</div>') +
    '<div id="fbody">' + movFields(f) + '</div>' +
    (old && old.por ? '<div class="hint">Registrado por <span class="who" data-uid="' + esc(old.por) + '"></span></div>' : '') +

async function saveMov(old){
  if(!S.canWrite) return toast('No tienes permiso para guardar');
  const f = M.f; const btn = $('#bSave');
  if(!f.fecha) return toast('Falta la fecha');
  btn.disabled = true;
  try{
    if(f.tipo === 'cambio'){
      const o = num(f.o_monto), d = num(f.d_monto);
      if(!(o > 0) || !(d > 0)) { btn.disabled = false; return toast('Escribe los dos montos'); }
      if(f.o_caja === f.d_caja) { btn.disabled = false; return toast('Elige dos cajas distintas'); }
      const grupo = rid(), now = Date.now();
      const tasaImp = (CAJAS[f.o_caja].m !== CAJAS[f.d_caja].m) ? r2((CAJAS[f.o_caja].m === 'VES' ? o / d : d / o) * 100) / 100 : null;
      const base = {fecha:f.fecha, tipo:'cambio', grupo, desc:f.desc.trim(), cliente:'', tercero:'', pagado:true, por:S.uid || '', creado:now, tasa:tasaImp};
      await S.db.collection('movs').doc().set(Object.assign({}, base, {signo:-1, caja:f.o_caja, moneda:CAJAS[f.o_caja].m, monto:r2(o)}));
      await S.db.collection('movs').doc().set(Object.assign({}, base, {signo:1, caja:f.d_caja, moneda:CAJAS[f.d_caja].m, monto:r2(d)}));
    } else {
      const monto = num(f.monto);
      if(!(monto > 0)) { btn.disabled = false; return toast('Escribe un monto mayor a 0'); }
      const credit = f.tipo === 'venta' || f.tipo === 'compra';
      const pagado = credit ? !!f.pagado : true;
      const caja = pagado ? f.caja : null;
      const moneda = pagado ? CAJAS[f.caja].m : f.moneda;
      let tasa = null;
      if(moneda === 'VES'){
        tasa = num(f.tasa);
        if(!(tasa > 0)) tasa = S.tasa || 0;
        if(!(tasa > 0)) { btn.disabled = false; return toast('Escribe la tasa Bs por $'); }
        tasa = Math.round(tasa * 10000) / 10000;
      }
      let clienteId = '', clienteNombre = '';
      if(f.tipo === 'venta' && f.clienteId){
        if(f.clienteId === '__nuevo'){
          const nombre = (f.clienteNuevo || '').trim();
          if(!nombre) { btn.disabled = false; return toast('Escribe el nombre del cliente'); }
          const ref = S.db.collection('clientes').doc();
          await ref.set({nombre, telefono:'', notas:'', creado:Date.now(), por:S.uid || ''});
          clienteId = ref.id; clienteNombre = nombre;
        } else { clienteId = f.clienteId; const c = cliById(clienteId); clienteNombre = c ? c.nombre : ''; }
      }
      const doc = {
        fecha:f.fecha, tipo:f.tipo, signo:(TIPOS[f.tipo].s || (old ? old.signo : 1)), caja, moneda, monto:r2(monto), pagado, tasa,
        clienteId, clienteNombre, tercero: f.tipo === 'compra' ? f.tercero.trim() : '', cat: f.tipo === 'gasto' ? f.cat : '',
        desc:f.desc.trim(), por: old ? (old.por || '') : (S.uid || ''), creado: old ? (old.creado || Date.now()) : Date.now(), grupo:''
      };
      if(old) await S.db.collection('movs').doc(old.id).set(doc);
      else await S.db.collection('movs').doc().set(doc);
    }
    closeSheet(1); toast('Guardado');
  }catch(e){
    btn.disabled = false;
    toast('No se pudo guardar' + (e && e.code ? ' (' + e.code + ')' : ''));
  }
}

function cobrarSync(f){
  if(f.montoEdit) return;
  const m = f.m, c = CAJAS[f.caja];
  let v = m.monto;
  if(c.m !== m.moneda){
    const t = S.tasa || m.tasa || 0;
    if(t) v = c.m === 'VES' ? m.monto * t : m.monto / t;
  }
  f.monto = String(r2(v)).replace('.',',');
}

function bcvPaint(){

  el.hidden = false;

async function bcvFetch(){
  const get = async u => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 8000); try{ const r = await fetch(u, {signal:c.signal, cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); } finally { clearTimeout(t); } };
  let out = null;
  try{
    const [u, e] = await Promise.all([get('https://ve.dolarapi.com/v1/dolares/oficial'), get('https://ve.dolarapi.com/v1/euros/oficial').catch(() => null)]);
    const usd = Number(u.promedio || u.venta || u.compra), eur = e ? Number(e.promedio || e.venta || e.compra) : 0;
    if(usd > 0) out = {usd, eur: eur > 0 ? eur : 0, fecha: String(u.fechaActualizacion || '').slice(0,10).split('-').reverse().slice(0,2).join('/')};
  }catch(x){}
  if(!out){
    try{ const j = await get('https://bcv.today/api/rate.json'); if(Number(j.USD) > 0) out = {usd:Number(j.USD), eur:Number(j.EUR) || 0, fecha:''}; }catch(x){}
  }
  if(out){ S.bcv = out; try{ localStorage.setItem('bcv', JSON.stringify(out)); }catch(x){} }
  else if(!S.bcv){ try{ S.bcv = JSON.parse(localStorage.getItem('bcv') || 'null'); }catch(x){} }
  bcvPaint();
  return S.bcv;
}

/* ---------- estado financiero del mes ---------- */
let LAST_CIERRE = '';
function buildCierre(mes){
  const eff = m => String(m.fechaCobro || m.fecha || '');
  const inMes = m => String(m.fecha || '').indexOf(mes) === 0;
  const ventasL = S.movs.filter(m => m.tipo === 'venta' && inMes(m));
  const ventas = ventasL.reduce((a,m) => a + usd(m), 0);
  const compras = S.movs.filter(m => m.tipo === 'compra' && inMes(m)).reduce((a,m) => a + usd(m), 0);
  const gastosAll = S.movs.filter(m => m.tipo === 'gasto' && inMes(m));
  const gastosL = gastosAll.filter(m => NOOP.indexOf(m.cat) < 0);
  const personalL = gastosAll.filter(m => NOOP.indexOf(m.cat) >= 0 && RET.indexOf(m.cat) < 0);
  const retL = S.movs.filter(m => esRetiro(m) && inMes(m));
  const retiros = retL.reduce((a,m) => a + usd(m), 0);
  const porRet = {}; retL.forEach(m => { const k = m.tipo === 'retiro' ? 'Retiros' : m.cat; porRet[k] = (porRet[k] || 0) + usd(m); });
  const aportes = S.movs.filter(m => m.tipo === 'aporte' && inMes(m)).reduce((a,m) => a + usd(m), 0);
  const ajustes = S.movs.filter(m => m.tipo === 'ajuste' && inMes(m)).reduce((a,m) => a + m.signo * usd(m), 0);
  const personal = personalL.reduce((a,m) => a + usd(m), 0);
  const porCatP = {}; personalL.forEach(m => { porCatP[m.cat] = (porCatP[m.cat] || 0) + usd(m); });
  const porCat = {}; gastosL.forEach(m => { const k = m.cat || 'Otros'; porCat[k] = (porCat[k] || 0) + usd(m); });
  const gastos = gastosL.reduce((a,m) => a + usd(m), 0);
  const util = ventas - compras - gastos;
  const margen = ventas > 0 ? util / ventas * 100 : 0;
  const cajas = Object.keys(CAJAS).map(k => {
    let ini = 0, ent = 0, sal = 0;
    S.movs.forEach(m => {
      if(m.caja !== k || m.pagado === false) return;
      const e = eff(m);
      if(e < (mes.length === 4 ? mes + '-01-01' : mes + '-01')) ini += m.signo * m.monto;
      else if(e.indexOf(mes) === 0){ if(m.signo > 0) ent += m.monto; else sal += m.monto; }
    });
    return {k, n:CAJAS[k].n, m:CAJAS[k].m, ini, ent, sal, fin: ini + ent - sal};
  });
  const cli = {}; ventasL.forEach(m => { const n = cliName(m) || 'Sin cliente'; cli[n] = (cli[n] || 0) + usd(m); });
  const top = Object.keys(cli).map(n => ({n, v:cli[n]})).sort((a,b) => b.v - a.v).slice(0,5);
  let cobrar = 0, pagar = 0;
  S.movs.filter(m => m.pagado === false).forEach(m => { if(m.signo > 0) cobrar += usd(m); else pagar += usd(m); });
  return {mes, ventas, compras, gastos, porCat, personal, porCatP, retiros, porRet, aportes, ajustes, util, margen, cajas, top, cobrar, pagar, nVentas: ventasL.length};
}

  if(!S.tasa) L.push('\nNota: sin tasa definida, los movimientos en Bs sin tasa propia no se convierten a dólares.');

}
function rangoAnio(y, hasta){
  const o = {ventas:0,compras:0,gastos:0,personal:0,retiros:0,aportes:0};
  S.movs.forEach(m => {
    const f = String(m.fecha || ''); if(f.slice(0,4) !== String(y) || f.slice(5,7) > hasta) return;
    if(m.tipo === 'venta') o.ventas += usd(m);
    else if(m.tipo === 'compra') o.compras += usd(m);
    else if(m.tipo === 'gasto'){ if(NOOP.indexOf(m.cat) >= 0) o.personal += usd(m); else o.gastos += usd(m); }
  });
  o.util = o.ventas - o.compras - o.gastos; return o;
}

  els.forEach(el => { el.textContent = nameOf(el.dataset.uid); });

  }catch(e){}
}

/* ---------- exportar a Excel (CSV) ---------- */
async function exportCsv(){
  if(!S.movs.length) return toast('No hay movimientos');
  const n = v => (v == null || v === '') ? '' : String(Math.round(v * 100) / 100).replace('.',',');
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const rows = [['Fecha','Tipo','Caja','Moneda','Entrada','Salida','Tasa Bs/$','Equivalente en $','Cliente','Proveedor','Categoría','Detalle','Estado']];
  sorted(S.movs).reverse().forEach(m => {
    const t = (TIPOS[m.tipo] || {n:m.tipo}).n;
    rows.push([m.fecha, t, m.caja ? CAJAS[m.caja].n : '', m.moneda || '', m.signo > 0 ? n(m.monto) : '', m.signo > 0 ? '' : n(m.monto), n(m.tasa), n((m.signo || 1) * usd(m)),
      cliName(m) || '', m.tercero || '', m.cat || '', m.desc || '', m.pagado === false ? 'Pendiente' : 'Pagado']);
  });
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const name = 'encanto-movimientos-' + ymd(new Date()) + '.csv';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  try{
    const file = new File([blob], name, {type:'text/csv'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('Archivo listo: ' + (rows.length - 1) + ' movimientos');
}

/* ---------- importar historial ---------- */
async function doImport(file){
  try{
    const d = JSON.parse(await file.text());
    if(!d.movs || !d.movs.length) return toast('Archivo no válido');
    const ok = await askConfirm('Se cargarán ' + d.movs.length + ' movimientos y ' + (d.clientes||[]).length + ' clientes del historial de Zelle. Si ya lo importaste antes, no se duplican. ¿Continuar?','Importar');
    if(!ok) return;
    toast('Importando… no cierres la app');
    if(d.reemplaza){ const r = d.reemplaza;
      for(const m of S.movs.filter(m => m.tipo === r.tipo && m.caja === r.caja && m.fecha === r.fecha && Math.abs((m.monto||0) - r.monto) < 0.005 && String(m.id).indexOf('imp-') !== 0)){ await S.db.collection('movs').doc(m.id).delete(); } }
    const me = S.uid || '';
    const jobs = [];
    (d.clientes||[]).forEach(c => { const id = c.id; const o = Object.assign({}, c); delete o.id; o.por = me; jobs.push(() => S.db.collection('clientes').doc(id).set(o)); });
    d.movs.forEach(m => { const id = m.id; const o = Object.assign({}, m); delete o.id; o.por = me; jobs.push(() => S.db.collection('movs').doc(id).set(o)); });
    for(let i = 0; i < jobs.length; i += 20) await Promise.all(jobs.slice(i, i + 20).map(f => f()));
    toast('Listo: historial cargado');
  }catch(e){ toast('No se pudo importar'); }
}
document.addEventListener('change', e => { if(e.target && e.target.id === 'impFile' && e.target.files[0]) doImport(e.target.files[0]); });

/* ---------- conexión (Firebase) ---------- */
function authMsg(x){
  const c = (x && x.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Correo o contraseña incorrectos.';
  if(/too-many/.test(c)) return 'Demasiados intentos. Espera unos minutos.';
  if(/network/.test(c)) return 'Sin conexión. Revisa tu internet.';
  return 'No se pudo entrar (' + c + ').';
}
function showLogin(auth, A){
  return new Promise(resolve => {
    $('#login').hidden = false;
    $('#loginBox').innerHTML = '<div style="text-align:center;margin:4px 0 10px">' + $('.brand svg').outerHTML.replace('<svg','<svg style="width:84px;height:84px"') + '<h3 style="margin:8px 0 0;font-family:Georgia,serif;font-size:24px">Encanto</h3><div class="hint" style="margin:0">flores &amp; detalles</div></div>' + '<div class="hint">Entra con tu correo y contraseña.</div>' +
      '<label>Correo<input id="lEmail" type="email" autocomplete="username" autocapitalize="none" autocorrect="off"></label>' +
      '<label>Contraseña<input id="lPass" type="password" autocomplete="current-password"></label>' +
      '<div id="lErr" class="hint"></div>' +
      '<div class="actions"><button class="btn sec" id="lReset">Olvidé mi contraseña</button><button class="btn" id="lGo">Entrar</button></div>';
    const msg = (m, ok) => { const e = $('#lErr'); e.textContent = m; e.className = 'hint ' + (ok ? 'pos' : 'neg'); };
    const go = async () => {
      const e = $('#lEmail').value.trim(), p = $('#lPass').value;
      if(!e || !p) return msg('Escribe tu correo y contraseña');
      $('#lGo').disabled = true;
      try{ const c = await A.signInWithEmailAndPassword(auth, e, p); $('#login').hidden = true; resolve(c.user); }
      catch(x){ $('#lGo').disabled = false; msg(authMsg(x)); }
    };
    $('#lGo').onclick = go;
    $('#lPass').addEventListener('keydown', ev => { if(ev.key === 'Enter') go(); });
    $('#lReset').onclick = async () => {
      const e = $('#lEmail').value.trim(); if(!e) return msg('Escribe tu correo arriba y vuelve a tocar.');
      try{ await A.sendPasswordResetEmail(auth, e); msg('Te enviamos un correo para cambiar la contraseña.', true); }
      catch(x){ msg(authMsg(x)); }
    };
  });
}
function askName(save){
  return new Promise(resolve => {
    $('#login').hidden = false;
    $('#loginBox').innerHTML = '<h3>¿Cómo te llamas?</h3><div class="hint">Así sabrán quién registró cada movimiento.</div>' +
      '<label>Tu nombre<input id="nName" autocomplete="given-name"></label><div class="actions"><button class="btn" id="nGo">Continuar</button></div>';

      $('#nGo').disabled = true;

async function getBackend(){
  if(window.__MOCK_BACKEND__) return window.__MOCK_BACKEND__;
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey || /^PEGA/.test(cfg.apiKey)){ S.setup = true; return null; }
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [AP, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = AP.initializeApp(cfg);
  const auth = A.getAuth(app);
  let fs;
  try{ fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch(e){ fs = F.getFirestore(app); }
  let u = await new Promise(res => { const un = A.onAuthStateChanged(auth, x => { un(); res(x); }); });
  if(!u) u = await showLogin(auth, A);
  /* una escritura se da por hecha al guardarse en el teléfono; se sincroniza sola cuando hay internet */
  const fast = p => Promise.race([p, new Promise(r => setTimeout(r, 1500))]);
  const docApi = r => ({
    id: r.id,
    set: d => fast(F.setDoc(r, d)),
    update: d => fast(F.updateDoc(r, d)),
    delete: () => fast(F.deleteDoc(r)),
    onSnapshot: (n, e) => F.onSnapshot(r, s => n({exists: s.exists(), data: () => s.data()}), e)
  });
  const db = {
    collection: path => {
      const c = F.collection(fs, path);
      return {
        doc: id => docApi(id ? F.doc(fs, path, id) : F.doc(c)),
        onSnapshot: (n, e) => F.onSnapshot(c, s => n({docs: s.docs.map(d => ({id: d.id, exists: true, data: () => d.data()}))}), e)
      };
    },
    doc: path => docApi(F.doc(fs, path))
  };
  try{
    const mine = await F.getDoc(F.doc(fs, 'perfiles', u.uid));
    if(!mine.exists()) await askName(n => F.setDoc(F.doc(fs, 'perfiles', u.uid), {nombre: n, correo: u.email || ''}));
  }catch(e){}
  const user = {
    id: async () => u.uid,
    can: () => true,
    isOwner: () => true,
    profiles: async ids => {
      const out = {};
      await Promise.all(ids.map(async id => {
        try{ const d = await F.getDoc(F.doc(fs, 'perfiles', id)); out[id] = {name: d.exists() ? (d.data().nombre || '') : ''}; }
        catch(e){ out[id] = {name: ''}; }
      }));
      return out;
    },
    signOut: () => A.signOut(auth)
  };
  return {db, user};
}

  if(!S.db){ clearTimeout(t); updateBanner(); return; }
  if(S.user && S.user.signOut) $('#salirBtn').hidden = false;
  try{ S.uid = (await S.user.id()) || null; }catch(e){}
  updateBanner();
  const onErr = e => { S.err = (e && e.code) || 'desconocido'; updateBanner(); };
  S.db.collection('movs').onSnapshot(snap => {
    S.movs = snap.docs.map(d => Object.assign({id:d.id}, d.data())); S.loaded.movs = true; clearTimeout(t); S.slow = false; S.err = ''; fill();
  }, onErr);
  S.db.collection('clientes').onSnapshot(snap => {
    S.cli = snap.docs.map(d => Object.assign({id:d.id}, d.data())); S.loaded.cli = true; fill();
  }, onErr);
  try{ S.bcv = JSON.parse(localStorage.getItem('bcv') || 'null'); }catch(x){}
  bcvFetch();
  S.db.doc('config/tasa').onSnapshot(snap => {
    S.tasa = snap.exists ? (Number((snap.data() || {}).valor) || 0) : 0; S.loaded.tasa = true; fill();
  }, onErr);
}
if('serviceWorker' in navigator && !window.__MOCK_BACKEND__ && /^https:|^http:\/\/localhost/.test(location.href)){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
})();
</script>
</body>
</html>
